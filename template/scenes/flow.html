<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Request to done, illustration</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; color: #15201c; }
  .frame { position: absolute; left: 12px; top: 12px; right: 12px; bottom: 24px; background: #fff;
    border: 2px solid #dfe4e1; border-radius: 24px; box-shadow: 0 10px 20px -12px rgba(21, 32, 28, .30);
    padding: 40px; display: flex; flex-direction: column; gap: 22px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .name { font-size: 32px; font-weight: 700; }
  .status { font-size: 24px; font-weight: 700; padding: 8px 20px; border-radius: 999px; transition: all .4s; }
  .status.wait { background: #eef1ef; color: #4d5b56; }
  .status.go { background: #e3f3f1; color: #0b5a54; }
  .status.done { background: #0f766e; color: #fff; }
  .track { height: 8px; background: #dfe4e1; border-radius: 8px; position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #0f766e; border-radius: 8px; transition: width .7s; }
  .step { display: flex; align-items: center; gap: 18px; font-size: 26px; color: #8a9893; transition: color .4s; }
  .dot { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #c9d2ce; flex: none; display: flex;
    align-items: center; justify-content: center; color: #fff; font-size: 22px; font-weight: 700; transition: all .4s; }
  .step.on { color: #15201c; } .step.on .dot { background: #0f766e; border-color: #0f766e; }
  .step.now { color: #15201c; font-weight: 700; } .step.now .dot { border-color: #0f766e; box-shadow: 0 0 0 8px rgba(15, 118, 110, .15); }
  .note { margin-top: auto; background: #e3f3f1; color: #0b5a54; border-radius: 12px; padding: 18px 22px; font-size: 24px; font-weight: 600; }
</style>
</head>
<body>
<div class="frame">
  <div class="top"><span class="name">Request #1042</span><span class="status" id="status"></span></div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="step"><span class="dot">&#10003;</span>Customer sends a request</div>
  <div class="step"><span class="dot">&#10003;</span>You confirm the details</div>
  <div class="step"><span class="dot">&#10003;</span>The work is delivered</div>
  <div class="step"><span class="dot">&#10003;</span>Payment arrives</div>
  <div class="note" id="note"></div>
</div>
<script src="scene.js"></script>
<script>
  var steps = document.querySelectorAll(".step");
  var labels = [["Waiting", "wait"], ["Confirmed", "go"], ["Delivered", "go"], ["Paid", "done"]];
  var notes = ["A new request arrives with everything you need", "One click confirms it and tells the customer",
    "Delivery is recorded against the request", "The payment is matched to the request automatically"];
  Scene.steps({
    count: steps.length,
    stepMs: 2600,
    render: function (k) {
      steps.forEach(function (s, j) { s.className = "step" + (j < k ? " on" : j === k ? " now" : ""); });
      if (k === steps.length - 1) steps[k].className = "step on";
      document.getElementById("fill").style.width = (k / (steps.length - 1)) * 100 + "%";
      var st = document.getElementById("status");
      st.textContent = labels[k][0];
      st.className = "status " + labels[k][1];
      document.getElementById("note").textContent = notes[k];
    },
  });
</script>
</body>
</html>
